name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: checks (macOS 14, ARM64)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fixture toolchain
        run: brew install msitools mingw-w64

      - name: Install Porte
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e .

      - name: Syntax check
        run: .venv/bin/python -m compileall -q porte fixtures/installer tests

      - name: CLI entry points
        run: |
          .venv/bin/porte --help > /dev/null
          .venv/bin/forge --help > /dev/null 2>&1

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Installer importer, end to end
        run: |
          ./fixtures/installer/build.sh
          .venv/bin/python fixtures/installer/verify.py

      - name: Engine fixtures and oracle mutation check
        run: |
          .venv/bin/porte build --force
          .venv/bin/porte selftest

      - name: Upload verifier output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: build/
          retention-days: 3
          if-no-files-found: ignore
